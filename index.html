<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Costura - SEBRAE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jeju+Gothic&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-visual">
          <img
            class="hero-cover"
            src="https://placehold.co/960x413"
            alt="Costura em destaque"
          />
          <img
            class="hero-avatar"
            src="https://placehold.co/159x159"
            alt="Ícone Costura"
          />
        </div>
        <header class="hero-header">
          <h1 class="brand">Costura</h1>
          <a class="pill" href="#inicio">Início: Consulte</a>
        </header>
        <div class="hero-body">
          <div class="hero-info">
            <span class="hero-subtitle">SEBRAE</span>
            <p class="hero-address">Endereço - SP</p>
          </div>
          <div class="hero-actions">
            <a class="btn btn-outline" href="#saiba-mais">Saiba Mais</a>
            <a class="btn btn-solid" href="#inscricao">Saiba Mais</a>
            <a class="btn btn-solid" href="#contato">Saiba Mais</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
